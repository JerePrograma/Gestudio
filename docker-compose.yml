services:
  db:
    image: postgres:15.18-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestudio_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      TZ: ${APP_TIME_ZONE:-America/Argentina/Buenos_Aires}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-gestudio-backend:local}
    build:
      context: ./backend
      args:
        VCS_REF: ${VCS_REF:-unknown}
        COMPOSE_SHA: ${COMPOSE_SHA:-unknown}
        SOURCE_SHA: ${BACKEND_SOURCE_SHA:-unknown}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gestudio_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_FLYWAY_BASELINE_VERSION: ${SPRING_FLYWAY_BASELINE_VERSION:-1}
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-before-sharing}
      JWT_ISSUER: ${JWT_ISSUER:-gestudio-local}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P7D}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Argentina/Buenos_Aires}
      APP_RECEIPTS_PATH: /app/data/receipts
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      APP_SCHEDULING_ENABLED: ${APP_SCHEDULING_ENABLED:-false}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
      APP_EMAIL_PROVIDER: ${APP_EMAIL_PROVIDER:-NOOP}
      APP_EMAIL_DRY_RUN: ${APP_EMAIL_DRY_RUN:-true}
      APP_EMAIL_REAL_NETWORK_ALLOWED: ${APP_EMAIL_REAL_NETWORK_ALLOWED:-false}
      APP_EMAIL_KILL_SWITCH: ${APP_EMAIL_KILL_SWITCH:-true}
      APP_EMAIL_FROM_ADDRESS: ${APP_EMAIL_FROM_ADDRESS:-}
      APP_EMAIL_FROM_NAME: ${APP_EMAIL_FROM_NAME:-Gestudio}
      APP_EMAIL_SENT_COPY_MODE: ${APP_EMAIL_SENT_COPY_MODE:-DISABLED}
      APP_EMAIL_FAKE_OUTCOME: ${APP_EMAIL_FAKE_OUTCOME:-SUCCESS}
      APP_EMAIL_GMAIL_HOST: ${APP_EMAIL_GMAIL_HOST:-}
      APP_EMAIL_GMAIL_PORT: ${APP_EMAIL_GMAIL_PORT:-587}
      APP_EMAIL_GMAIL_USERNAME: ${APP_EMAIL_GMAIL_USERNAME:-}
      APP_EMAIL_GMAIL_APP_PASSWORD: ${APP_EMAIL_GMAIL_APP_PASSWORD:-}
      APP_EMAIL_SMTP_CONNECTION_TIMEOUT_MS: ${APP_EMAIL_SMTP_CONNECTION_TIMEOUT_MS:-5000}
      APP_EMAIL_SMTP_READ_TIMEOUT_MS: ${APP_EMAIL_SMTP_READ_TIMEOUT_MS:-5000}
      APP_EMAIL_SMTP_WRITE_TIMEOUT_MS: ${APP_EMAIL_SMTP_WRITE_TIMEOUT_MS:-5000}
      APP_EMAIL_SENT_COPY_HOST: ${APP_EMAIL_SENT_COPY_HOST:-}
      APP_EMAIL_SENT_COPY_PORT: ${APP_EMAIL_SENT_COPY_PORT:-993}
      APP_EMAIL_SENT_COPY_USERNAME: ${APP_EMAIL_SENT_COPY_USERNAME:-}
      APP_EMAIL_SENT_COPY_APP_PASSWORD: ${APP_EMAIL_SENT_COPY_APP_PASSWORD:-}
      APP_EMAIL_SENT_COPY_FOLDER: ${APP_EMAIL_SENT_COPY_FOLDER:-}
      APP_EMAIL_SENT_COPY_CONNECTION_TIMEOUT_MS: ${APP_EMAIL_SENT_COPY_CONNECTION_TIMEOUT_MS:-5000}
      APP_EMAIL_SENT_COPY_READ_TIMEOUT_MS: ${APP_EMAIL_SENT_COPY_READ_TIMEOUT_MS:-5000}
      APP_OBSERVABILITY_METRICS_TOKEN: ${APP_OBSERVABILITY_METRICS_TOKEN:-}
      APP_SECURITY_REFRESH_COOKIE_NAME: ${APP_SECURITY_REFRESH_COOKIE_NAME:-gestudio_refresh}
      APP_SECURITY_REFRESH_COOKIE_SECURE: ${APP_SECURITY_REFRESH_COOKIE_SECURE:-false}
      APP_SECURITY_REFRESH_COOKIE_SAME_SITE: ${APP_SECURITY_REFRESH_COOKIE_SAME_SITE:-Strict}
      APP_SECURITY_REFRESH_COOKIE_DOMAIN: ${APP_SECURITY_REFRESH_COOKIE_DOMAIN:-}
      APP_SECURITY_REFRESH_COOKIE_PATH: ${APP_SECURITY_REFRESH_COOKIE_PATH:-/api/login}
      APP_BOOTSTRAP_SUPERADMIN_ENABLED: ${APP_BOOTSTRAP_SUPERADMIN_ENABLED:-false}
      APP_BOOTSTRAP_SUPERADMIN_USERNAME: ${APP_BOOTSTRAP_SUPERADMIN_USERNAME:-}
      APP_BOOTSTRAP_SUPERADMIN_PASSWORD: ${APP_BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      APP_LOCAL_ADMIN_PASSWORD_RESET_ENABLED: ${APP_LOCAL_ADMIN_PASSWORD_RESET_ENABLED:-false}
      APP_LOCAL_ADMIN_PASSWORD_RESET_USERNAME: ${APP_LOCAL_ADMIN_PASSWORD_RESET_USERNAME:-}
      APP_LOCAL_ADMIN_PASSWORD_RESET_PASSWORD: ${APP_LOCAL_ADMIN_PASSWORD_RESET_PASSWORD:-}
      BACKEND_HEALTHCHECK_MODE: ${BACKEND_HEALTHCHECK_MODE:-actuator-readiness-v1}
      GESTUDIO_HOME: /app
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${BACKEND_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - receipts_data:/app/data/receipts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "case \"$${BACKEND_HEALTHCHECK_MODE}\" in actuator-readiness-v1) wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness | grep -q '\"status\":\"UP\"' ;; legacy-api-401-v1) wget -S -O /dev/null http://127.0.0.1:$${SERVER_PORT}/api/alumnos 2>&1 | grep -Eq 'HTTP/[0-9.]+ 401' ;; *) exit 1 ;; esac"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-gestudio-frontend:local}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_APP_TIME_ZONE: ${VITE_APP_TIME_ZONE:-America/Argentina/Buenos_Aires}
        VCS_REF: ${VCS_REF:-unknown}
        COMPOSE_SHA: ${COMPOSE_SHA:-unknown}
        SOURCE_SHA: ${FRONTEND_SOURCE_SHA:-unknown}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  receipts_data:

networks:
  internal:
