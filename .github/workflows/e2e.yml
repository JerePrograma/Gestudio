name: Control Plane E2E

on:
  workflow_dispatch:
    inputs:
      recovery_baseline_commit:
        description: Previous approved backend commit (full SHA40)
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gestudio-control-plane-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control-plane-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECOVERY_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || inputs.recovery_baseline_commit }}

    steps:
      - name: Checkout verified SHA
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The selected PR/push baseline may span several review commits.
          # Complete history allows an ancestry check without changing HEAD.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up pinned Python for stdlib OCI content proofs
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"

      - name: Install pinned Chromium runtime
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Validate E2E TypeScript and discovery
        working-directory: frontend
        env:
          GESTUDIO_E2E_BASE_URL: http://127.0.0.1:18081
          GESTUDIO_E2E_API_URL: http://127.0.0.1:18080/api
          GESTUDIO_E2E_COMPOSE_PROJECT: gestudio-e2e-000000000000
          GESTUDIO_E2E_RUN_ID: "000000000000"
          GESTUDIO_E2E_BOOTSTRAP_COUNTER: "1"
          GESTUDIO_E2E_PLATFORM_USERNAME: static.e2e.platform
          GESTUDIO_E2E_PLATFORM_PASSWORD: static-not-used
          GESTUDIO_E2E_PLATFORM_TOTP_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          GESTUDIO_E2E_ALPHA_CODE: static-alpha-e2e
          GESTUDIO_E2E_ALPHA_NAME: Escuela Danza Marcos Paz
          GESTUDIO_E2E_ALPHA_USERNAME: static.alpha.admin
          GESTUDIO_E2E_ALPHA_PASSWORD: static-not-used
          GESTUDIO_E2E_BETA_CODE: static-beta-e2e
          GESTUDIO_E2E_BETA_NAME: Escuela Beta E2E
          GESTUDIO_E2E_BETA_USERNAME: static.beta.admin
          GESTUDIO_E2E_BETA_PASSWORD: static-not-used
        run: |
          npm run e2e:typecheck
          npm run e2e:list

      - name: Validate ephemeral financial runner contract
        shell: pwsh
        run: |
          ./scripts/e2e/test-run-control-plane-contract.ps1
          ./scripts/e2e/test-financial-recovery-contract.ps1
          node --test ./frontend/scripts/verify-financial-recovery.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Financial recovery Node contract failed.' }
          ./scripts/security/test-scan-candidate-contract.ps1
          python -B ./scripts/security/test_image_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'OCI image identity Python contract failed.' }

      - name: Run isolated fresh financial E2E and recovery drill
        shell: pwsh
        run: ./scripts/e2e/run-control-plane.ps1 -FinancialFlow -RecoveryDrill -ExportCandidateImages -RecoveryHistoricalCommit $env:RECOVERY_BASELINE_COMMIT

      - name: Scan the exact tested candidate archives and generate SBOM proofs
        shell: pwsh
        run: ./scripts/security/scan-e2e-candidate.ps1

      - name: Upload sanitized E2E result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: control-plane-e2e-${{ github.sha }}
          path: |
            artifacts/e2e/result.json
            artifacts/e2e/playwright.log
            artifacts/e2e/receipt-path-linux.log
            artifacts/e2e/image-builds.log
            artifacts/e2e/financial-recovery.log
            artifacts/e2e/security-*/
          if-no-files-found: error
          retention-days: 14

  required-e2e:
    if: always()
    needs: control-plane-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Enforce E2E result
        env:
          E2E_RESULT: ${{ needs.control-plane-e2e.result }}
        run: test "$E2E_RESULT" = success
