spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL}

app:
  time-zone: ${APP_TIME_ZONE}
  receipts-path: ${APP_RECEIPTS_PATH}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  scheduling-enabled: ${APP_SCHEDULING_ENABLED:true}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
