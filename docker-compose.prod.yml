services:
  db:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}

  backend:
    build: !reset null
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_FLYWAY_BASELINE_VERSION: ${SPRING_FLYWAY_BASELINE_VERSION:-1}
      APP_MULTITENANCY_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:?JWT_ACCESS_TOKEN_TTL is required}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:?JWT_REFRESH_TOKEN_TTL is required}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
      APP_EMAIL_PROVIDER: ${APP_EMAIL_PROVIDER:-NOOP}
      APP_EMAIL_DRY_RUN: ${APP_EMAIL_DRY_RUN:-true}
      APP_EMAIL_REAL_NETWORK_ALLOWED: ${APP_EMAIL_REAL_NETWORK_ALLOWED:-false}
      APP_EMAIL_KILL_SWITCH: ${APP_EMAIL_KILL_SWITCH:-true}
      APP_EMAIL_SENT_COPY_MODE: ${APP_EMAIL_SENT_COPY_MODE:-DISABLED}
      APP_TIME_ZONE: ${APP_TIME_ZONE:?APP_TIME_ZONE is required}
      APP_RECEIPTS_PATH: /app/data/receipts
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      APP_SCHEDULING_ENABLED: ${APP_SCHEDULING_ENABLED:-true}
      APP_SECURITY_REFRESH_COOKIE_SECURE: "true"
      APP_OBSERVABILITY_METRICS_TOKEN: ${APP_OBSERVABILITY_METRICS_TOKEN:?APP_OBSERVABILITY_METRICS_TOKEN is required}
      SERVER_PORT: ${SERVER_PORT:-8080}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}

  frontend:
    build: !reset null
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
